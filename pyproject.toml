[project]
name = "mtga-collection-exporter"
version = "3.4.0"
description = "Export your MTG Arena card collection by scanning the running game's memory"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.0",
    "pymem>=1.13.0 ; sys_platform == 'win32'",
    "psutil>=5.9.0 ; sys_platform == 'darwin'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["mtg.py"]
